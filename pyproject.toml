[project]
name = "pytorch-compatibility"
version = "0.1.0"
description = "Deterministically extract a PyTorch / CUDA / compute-capability / Python compatibility table from upstream metadata and build sources, and render an interactive install-command picker."
readme = "readme.md"
requires-python = ">=3.11"
authors = [{ name = "Matěj Račinský", email = "racinsky.matej@seznam.cz" }]
# Data extraction uses only the Python standard library (urllib). The single
# third-party dependency is PyYAML, used to read the picker config file; the
# generated HTML itself stays fully self-contained.
dependencies = ["pyyaml>=6.0.3"]

[project.urls]
homepage = "https://github.com/racinmat/pytorch-compatibility"
repository = "https://github.com/racinmat/pytorch-compatibility"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.uv]
# This is an application/tool, not a distributable library, so uv should not try
# to build and install the project itself into the environment.
package = false

[tool.pytest.ini_options]
testpaths = ["test_torch_compat.py"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# html.py embeds a large JS/CSS template with long lines
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
files = ["torch_compat", "generate.py", "test_torch_compat.py"]
strict = true
